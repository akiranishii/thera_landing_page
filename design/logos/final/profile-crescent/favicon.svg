<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- thera. favicon: the profile-crescent mark reduced to a Cycladic head: the same crescent, crown and nose, with no island dot (a 2 px speck at 16 px) and no lip or chin (sub-pixel lumps at 16 px), one straight line from under the nose to the rim instead. The disc centre is slid 8 units left to (24, 32) so the ink (x 15.88..52) is centred in the tile, and at 16 px (1 px = 4 units) the nose tip (28,32), the mouth corner (20,36), the vertical edge x 20 and the rim x 52 all sit on pixel boundaries. Use at 16 and 32 px; at 48 px and above use mark.svg. -->
  <path fill="#223848" d="M 18.63 4.52 A 28 28 0 1 1 24 60 A 4 4 0 0 1 20 56 L 20 36 L 26.03 32.98 A 2 2 0 0 0 26.83 30.13 L 18 16 A 21.79 21.79 0 0 0 15.88 10.35 A 4 4 0 0 1 18.63 4.52 Z"/>
</svg>
