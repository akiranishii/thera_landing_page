<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- thera. mark, profile-crescent (Caldera and Sunken Head). One disc c(32,32) r28 split by a goddess profile looking right: the ink crescent in front of the face is the cliffs of Thera, the void behind the profile is the head, the half that sank. Profile: forehead arc r25.1 from the rim at (21 6.25), straight nose ridge 30.4 deg from vertical (18.56 long) with an r2 tip, underside 34.9 deg, 4.82-unit lip plane, chin arc r8.5 (apex 2 behind the tip), throat at 38 deg, neck to the rim at 76 deg. Both horns are blunted with r4 fillets (end chords 6.35 and 6.59) so the crescent never tapers to a point. The island dot r5.2 is knocked out at (46.3 28), below eye level and ahead of the nose, where the gaze lands. One path, evenodd, no strokes. Two-tone: the crescent in the primary #466680, the sunken head filled in sea blue #8DA8BB (the one secondary element), so the disc is sealed. -->
  <path fill="#8DA8BB" d="M 35.32 59.8 A 28 28 0 0 1 26.31 4.59 A 4 4 0 0 0 23.55 10.3 A 25.1 25.1 0 0 1 25.8 17 L 34.26 31.41 A 2 2 0 0 1 33.68 34.06 L 29.9 36.7 L 30.3 41.5 A 8.5 8.5 0 0 1 31.4 53.13 L 30.97 54.86 A 4 4 0 0 0 35.32 59.8 Z"/>
