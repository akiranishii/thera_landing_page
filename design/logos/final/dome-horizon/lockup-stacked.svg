<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140">
  <!-- thera. / dome-horizon / stacked lockup -->
  <!-- Mark at full size (52 x 50) centred on x 80, y 20..70. Wordmark Inter 600 44 px, letter-spacing -1.5, baseline 120 (cap top 88, 18 units under the mark). -->
  <!-- The wordmark is set so the mark's axis falls midway between the centre of "thera" and the centre of "thera." (ink x 26..139): centring on the whole string pushes the letters visibly left, centring on the letters alone leaves the period hanging outside the box. -->
  <g transform="translate(48 13)">
    <path d="M6 28 A21 21 0 0 1 48 28 Z" fill="#223848"/>
    <path d="M16 36 A21 21 0 0 0 58 36 Z" fill="#223848"/>
  </g>
  <text x="25.5" y="120" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="600" letter-spacing="-1.5" fill="#223848">thera.</text>
</svg>
