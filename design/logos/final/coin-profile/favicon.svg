<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- thera. favicon, coin-profile: the mark re-cut for the 16 px grid (1 px = 4 units). Same disc and the same vertical back edge at x 24 (column 6); the profile is reduced to straight moves that sit on the grid: forehead at x 36 (column 9), nose ridge to a tip on (44, 32), underside to (40, 36), lip-and-chin plane at x 40 down to y 48, back to the neck at x 36 (y 52) and down to the rim. At 16 px the band is three clean columns with a nose and a one-column chin step. Flips to #F7F9FA under prefers-color-scheme: dark. Use at 16 and 32; use mark.svg at 48 and above. -->
  <style>@media (prefers-color-scheme: dark) { path { fill: #F7F9FA; } }</style>
  <path fill="#223848" d="M 24 5.17 A 28 28 0 0 0 24 58.83 Z"/>
  <path fill="#223848" d="M 36 59.71 A 28 28 0 0 0 36 4.29 L 36 20 L 44 32 L 40 36 L 40 48 L 36 52 Z"/>
</svg>
