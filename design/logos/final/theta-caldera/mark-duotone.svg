<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- thera. mark, two-tone default (same geometry as mark.svg, split into two closed paths).
       Ink piece: the dome plus the bridge, bounded below by y=40 (the horizon), with the slot cut out of its left.
       Blue piece: the clean lower cap, chord y=40, in the primary blue. The colour seam continues the slot's lower edge,
       so the horizon is one straight line across the disc: light where the sea enters, colour where the cliff meets it. -->
