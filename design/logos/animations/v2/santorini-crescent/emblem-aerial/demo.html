<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Santorini emblem demo</title>
<style>
  body { margin:0; background:#F7F9FA; font: 14px Inter, system-ui, sans-serif; color:#223848; display:flex; flex-direction:column; align-items:center; gap:16px; padding:24px; }
  #stage { width: 480px; height: 480px; background:#fff; border:1px solid #DDE6EC; border-radius:24px; overflow:hidden; }
  #stage svg { width:100%; height:100%; display:block; }
  .controls { display:flex; gap:12px; align-items:center; }
  input[type=range] { width: 320px; }
</style>
</head>
<body data-track="santorini-crescent">
  <div id="stage"></div>
  <div class="controls">
    <span id="from"></span>
    <input id="t" type="range" min="0" max="1000" value="0" aria-label="Progress">
    <span id="to"></span>
    <button id="play" type="button">Play</button>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/flubber/0.4.2/flubber.min.js"></script>
  <script src="anim.js"></script>
  <script>
    (function () {
      var track = document.body.dataset.track;
      var def = window.TheraAnimations[track];
      var ctrl = def.mount(document.getElementById('stage'));
      window.__anim = ctrl; window.__def = def;
      document.getElementById('from').textContent = def.from;
      document.getElementById('to').textContent = def.to;
      var slider = document.getElementById('t');
      slider.addEventListener('input', function () { ctrl.set(slider.value / 1000); });
      ctrl.set(0);
      var raf = null;
      document.getElementById('play').addEventListener('click', function () {
        var dir = slider.value >= 1000 ? -1 : 1, start = null, from = slider.value / 1000, dur = 2400;
        cancelAnimationFrame(raf);
        function step(ts) { if (start === null) start = ts; var p = Math.min(1, (ts - start) / dur); var e = p < .5 ? 2*p*p : -1 + (4 - 2*p) * p; var t = Math.max(0, Math.min(1, from + dir * e * (dir > 0 ? 1 - from : from))); slider.value = Math.round(t * 1000); ctrl.set(t); if (p < 1) raf = requestAnimationFrame(step); }
        raf = requestAnimationFrame(step);
      });
    })();
  </script>
</body>
</html>
