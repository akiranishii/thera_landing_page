  <path d="M 36 48.52 A 17 17 0 1 0 28 48.52 L 28 42.25 A 11 11 0 1 1 36 42.25 Z" fill="#223848"/>
  <path d="M 36 59.71 A 28 28 0 1 0 28 59.71 L 28 53.63 A 22 22 0 1 1 36 53.63 Z" fill="#223848"/>
