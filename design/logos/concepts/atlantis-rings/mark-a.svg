<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- thera. / Atlantis rings / mark A "Harbor plan"
       Plan view of the ringed city. Centre (32,32). Radial bands, outside in:
       land ring 22..28 | water 17..22 | land ring 11..17 | water 6..11 | island r6.
       One straight canal, 8 wide (walls at x=28 and x=36), cut from the sea
       through both land rings down to the innermost water ring. Square-cut walls,
       no round caps: the canal is engineered, not an opening. -->
