<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- thera. / Cycladic head, variant B "Soft": a drawn outline with a round crown and a soft
       chin point, so it also reads as a speech bubble or a pin. Stroke 8, round joins; the
       centreline is inset 0.5 so the outer extent stays 10-54 x 4-59.5.
       Nose: tapered ridge, r3 at the brow (y=22) to r4.5 at the tip (y=36). It keeps 7 units of
       clear space to the inner edge of the crown and 6 units to the chin diagonal, so the counter
       around it survives at 16 px. -->
  <path stroke="#223848" stroke-width="8" stroke-linejoin="round" d="
    M32 8
    C44 8 50 16.5 50 27
    C50 40 40 50 34 54.5
    Q32 56.5 30 54.5
    C24 50 14 40 14 27
    C14 16.5 20 8 32 8
    Z"/>
  <path fill="#223848" d="
    M29 22 A3 3 0 0 1 35 22
    L36.5 36 A4.5 4.5 0 0 1 27.5 36
    Z"/>
</svg>
